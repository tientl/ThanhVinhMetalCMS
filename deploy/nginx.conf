# /etc/nginx/sites-available/thanhvinhmetal
# Thay thanhvinhmetal.vn bằng tên miền thật. SSL do certbot thêm: sudo certbot --nginx -d thanhvinhmetal.vn -d www.thanhvinhmetal.vn

server {
    listen 80;
    server_name thanhvinhmetal.vn www.thanhvinhmetal.vn;

    client_max_body_size 12m;

    # Ảnh đã upload: Nginx phục vụ trực tiếp, cache 30 ngày
    location /media/ {
        alias /var/www/thanhvinhmetal/public/media/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri @next;
    }

    # Tài nguyên build của Next.js
    location /_next/static/ {
        alias /var/www/thanhvinhmetal/.next/static/;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location @next {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
}
