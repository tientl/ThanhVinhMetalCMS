services:
  db:
    image: postgres:16-alpine
    container_name: thanhvinh-db
    restart: unless-stopped
    ports:
      - '5440:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: thanhvinh
    volumes:
      - thanhvinh_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d thanhvinh']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  thanhvinh_pgdata:
